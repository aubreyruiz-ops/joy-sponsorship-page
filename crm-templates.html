<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joy | Email Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161F;
    --body-text:#565D6D;
    --muted:#8890A0;
    --blue:#3355F0;
    --blue-dark:#1E33C7;
    --bg-light:#F6F7FB;
    --border:#E7E9F0;
    --radius-lg:16px;
    --radius-sm:10px;
    --shadow-sm:0 4px 14px rgba(20,22,60,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--body-text);
    background:var(--bg-light);
    line-height:1.5;
  }
  h1,h2,h3{
    font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  a{color:var(--blue);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}

  header.topbar{background:#fff;border-bottom:1px solid var(--border);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;max-width:1280px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:24px;}
  .brand h1{font-size:18px;}
  nav.tabs{display:flex;gap:4px;}
  nav.tabs a{padding:8px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;color:var(--body-text);}
  nav.tabs a.active{background:var(--bg-light);color:var(--blue);}
  .user{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);}
  .user img{width:28px;height:28px;border-radius:50%;}
  .user a{color:var(--muted);font-weight:600;}

  main{padding:32px 0 64px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  @media (max-width:840px){ .grid{grid-template-columns:1fr;} }

  .panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);}
  .panel-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .panel-body{padding:20px 24px;}

  .template-row{padding:14px 0;border-bottom:1px solid var(--border);}
  .template-row:last-child{border-bottom:none;}
  .template-row .name{font-weight:600;color:var(--ink);}
  .template-row .subject{font-size:13px;color:var(--muted);margin-top:2px;}
  .template-row .actions{display:flex;gap:8px;margin-top:10px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .field .hint{font-weight:400;color:var(--muted);}
  .field input, .field textarea{
    width:100%;font-family:inherit;font-size:14px;padding:9px 12px;
    border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--ink);
  }
  .field textarea{font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;resize:vertical;min-height:220px;line-height:1.5;}
  .field input:focus, .field textarea:focus{outline:none;border-color:var(--blue);}

  .form-actions{display:flex;gap:10px;align-items:center;}

  button{
    font-family:inherit;cursor:pointer;border:1px solid var(--border);background:#fff;
    border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);
  }
  button:hover{border-color:var(--blue);color:var(--blue);}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  button.primary:hover{background:var(--blue-dark);}
  button.danger:hover{border-color:#D64545;color:#D64545;}

  .state{padding:40px 24px;text-align:center;color:var(--muted);}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Joy CRM</h1>
      <nav class="tabs">
        <a href="/crm">Contacts</a>
        <a href="/crm-templates" class="active">Templates</a>
      </nav>
    </div>
    <div class="user" id="userBox"></div>
  </div>
</header>

<main>
  <div class="wrap grid">
    <div class="panel">
      <div class="panel-head">
        <h2 id="formTitle">New template</h2>
        <button type="button" id="cancelEditBtn" style="display:none;">Cancel</button>
      </div>
      <div class="panel-body">
        <form id="templateForm">
          <div class="field">
            <label for="f_name">Name</label>
            <input type="text" id="f_name" placeholder="e.g. Fall sponsor outreach" required>
          </div>
          <div class="field">
            <label for="f_subject">Subject line <span class="hint">— must exactly match what's sent in Apollo, so we can auto-detect it as sent</span></label>
            <input type="text" id="f_subject" placeholder="e.g. A sponsorship opportunity for you" required>
          </div>
          <div class="field">
            <label for="f_body">HTML body</label>
            <textarea id="f_body" placeholder="&lt;p&gt;Hi {{name}}, ...&lt;/p&gt;" required></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="primary" id="submitBtn">Add template</button>
          </div>
        </form>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Templates</h2>
      </div>
      <div class="panel-body">
        <div id="list" class="state">Loading&hellip;</div>
      </div>
    </div>
  </div>
</main>

<script>
  var templates = [];
  var editingId = null;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  async function api(path, opts){
    var res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
    if(res.status === 401){
      window.location.href = '/crm-login';
      throw new Error('Not signed in');
    }
    return res;
  }

  function renderUser(session){
    var box = document.getElementById('userBox');
    box.innerHTML =
      '<span>' + esc(session.username) + '</span>' +
      '<a href="/api/auth/logout">Log out</a>';
  }

  function renderList(){
    var list = document.getElementById('list');
    if(templates.length === 0){
      list.className = 'state';
      list.textContent = 'No templates yet — add one on the left.';
      return;
    }
    list.className = '';
    list.innerHTML = templates.map(function(t){
      return (
        '<div class="template-row">' +
          '<div class="name">' + esc(t.name) + '</div>' +
          '<div class="subject">' + esc(t.subject || '') + '</div>' +
          '<div class="actions">' +
            '<button type="button" data-edit="' + t.id + '">Edit</button>' +
            '<button type="button" class="danger" data-delete="' + t.id + '">Delete</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function startEdit(t){
    editingId = t.id;
    document.getElementById('f_name').value = t.name || '';
    document.getElementById('f_subject').value = t.subject || '';
    document.getElementById('f_body').value = t.body_html || '';
    document.getElementById('formTitle').textContent = 'Edit template';
    document.getElementById('submitBtn').textContent = 'Save changes';
    document.getElementById('cancelEditBtn').style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm(){
    editingId = null;
    document.getElementById('templateForm').reset();
    document.getElementById('formTitle').textContent = 'New template';
    document.getElementById('submitBtn').textContent = 'Add template';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }

  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  document.getElementById('list').addEventListener('click', async function(e){
    var editBtn = e.target.closest && e.target.closest('[data-edit]');
    if(editBtn){
      var t = templates.find(function(x){ return x.id === Number(editBtn.getAttribute('data-edit')); });
      if(t) startEdit(t);
      return;
    }

    var delBtn = e.target.closest && e.target.closest('[data-delete]');
    if(delBtn){
      var delId = Number(delBtn.getAttribute('data-delete'));
      if(!confirm('Delete this template?')) return;
      try {
        await api('/api/templates/' + delId, { method: 'DELETE' });
        templates = templates.filter(function(x){ return x.id !== delId; });
        if(editingId === delId) resetForm();
        renderList();
      } catch(err){ alert('Could not delete: ' + err.message); }
    }
  });

  document.getElementById('templateForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var name = document.getElementById('f_name').value.trim();
    var subject = document.getElementById('f_subject').value.trim();
    var bodyHtml = document.getElementById('f_body').value.trim();
    if(!name || !subject || !bodyHtml) return;

    var submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;

    try {
      if(editingId){
        var res = await api('/api/templates/' + editingId, {
          method: 'PUT',
          body: JSON.stringify({ name: name, subject: subject, body_html: bodyHtml }),
        });
        var data = await res.json();
        if(!res.ok) throw new Error(data.error);
        var existing = templates.find(function(x){ return x.id === editingId; });
        Object.assign(existing, data.template);
      } else {
        var res2 = await api('/api/templates', {
          method: 'POST',
          body: JSON.stringify({ name: name, subject: subject, body_html: bodyHtml }),
        });
        var data2 = await res2.json();
        if(!res2.ok) throw new Error(data2.error);
        templates.unshift(data2.template);
      }
      renderList();
      resetForm();
    } catch(err){
      alert('Could not save template: ' + err.message);
    } finally {
      submitBtn.disabled = false;
    }
  });

  async function init(){
    try {
      var meRes = await api('/api/auth/me');
      renderUser(await meRes.json());
      var res = await api('/api/templates');
      var data = await res.json();
      templates = data.templates || [];
      renderList();
    } catch(err){
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
