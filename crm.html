<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joy | CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161F;
    --body-text:#565D6D;
    --muted:#8890A0;
    --blue:#3355F0;
    --blue-dark:#1E33C7;
    --bg-light:#F6F7FB;
    --border:#E7E9F0;
    --radius-lg:16px;
    --radius-sm:10px;
    --shadow-sm:0 4px 14px rgba(20,22,60,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--body-text);
    background:var(--bg-light);
    line-height:1.5;
  }
  h1,h2{
    font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    margin:0;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  a{color:var(--blue);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:1280px;margin:0 auto;padding:0 28px;}

  header.topbar{
    background:#fff;
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;max-width:1280px;margin:0 auto;
  }
  .brand{display:flex;align-items:center;gap:24px;}
  .brand h1{font-size:18px;}
  nav.tabs{display:flex;gap:4px;}
  nav.tabs a{
    padding:8px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;color:var(--body-text);
  }
  nav.tabs a.active{background:var(--bg-light);color:var(--blue);}
  .user{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);}
  .user img{width:28px;height:28px;border-radius:50%;}
  .user a{color:var(--muted);font-weight:600;}

  main{padding:32px 0 64px;}
  .panel{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm);overflow:hidden;
  }
  .panel-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1000px;}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:700;}
  tr:last-child td{border-bottom:none;}
  td.wrap-cell{white-space:normal;max-width:220px;}
  .muted{color:var(--muted);}
  .pill{
    display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
    background:var(--bg-light);color:var(--body-text);
  }
  .pill.ok{background:#E6F7ED;color:#12805A;}

  button{
    font-family:inherit;cursor:pointer;border:1px solid var(--border);background:#fff;
    border-radius:var(--radius-sm);padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);
  }
  button:hover{border-color:var(--blue);color:var(--blue);}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  button.primary:hover{background:var(--blue-dark);}
  button:disabled{opacity:0.5;cursor:default;}
  button:disabled:hover{border-color:var(--border);color:var(--ink);}

  .dropdown{position:relative;display:inline-block;}
  .dropdown-menu{
    position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:220px;
    background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:0 12px 30px rgba(20,22,60,0.14);padding:8px;display:none;
  }
  .dropdown.open .dropdown-menu{display:block;}
  .dropdown-menu label{
    display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--ink);white-space:normal;
  }
  .dropdown-menu label:hover{background:var(--bg-light);}
  .dropdown-empty{padding:6px 8px;font-size:13px;color:var(--muted);}

  .state{padding:60px 24px;text-align:center;color:var(--muted);}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Joy CRM</h1>
      <nav class="tabs">
        <a href="/crm" class="active">Contacts</a>
        <a href="/crm-templates">Templates</a>
      </nav>
    </div>
    <div class="user" id="userBox"></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="panel">
      <div class="panel-head">
        <h2>Sponsor contacts</h2>
        <span class="muted" id="countLabel"></span>
      </div>
      <div id="content" class="state">Loading&hellip;</div>
    </div>
  </div>
</main>

<script>
  var applications = [];
  var templates = [];

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function fmtDate(iso){
    if(!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
  }

  function fmtList(v){
    if(Array.isArray(v)) return v.join(', ');
    return v || '';
  }

  async function api(path, opts){
    var res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
    if(res.status === 401){
      window.location.href = '/crm-login';
      throw new Error('Not signed in');
    }
    return res;
  }

  function renderUser(session){
    var box = document.getElementById('userBox');
    box.innerHTML =
      '<span>' + esc(session.username) + '</span>' +
      '<a href="/api/auth/logout">Log out</a>';
  }

  function sentTemplateIds(app){
    try {
      return Array.isArray(app.sent_template_ids) ? app.sent_template_ids : JSON.parse(app.sent_template_ids || '[]');
    } catch(e) { return []; }
  }

  function renderDropdown(app){
    var selected = sentTemplateIds(app).map(Number);
    var count = selected.length;
    var label = count === 0 ? 'None sent' : (count + ' sent');

    if(templates.length === 0){
      return '<span class="muted">No templates yet</span>';
    }

    var items = templates.map(function(t){
      var checked = selected.indexOf(t.id) !== -1 ? 'checked' : '';
      return '<label><input type="checkbox" data-app="' + app.id + '" data-template="' + t.id + '" ' + checked + '> ' + esc(t.name) + '</label>';
    }).join('');

    return (
      '<div class="dropdown" data-dropdown="' + app.id + '">' +
        '<button type="button" data-toggle="' + app.id + '">' + label + ' &#9662;</button>' +
        '<div class="dropdown-menu">' + items + '</div>' +
      '</div>'
    );
  }

  function renderApolloCell(app){
    if(app.apollo_synced_at){
      return (
        '<span class="pill ok">Synced ' + esc(fmtDate(app.apollo_synced_at)) + '</span> ' +
        '<button type="button" data-sync="' + app.id + '">Re-sync</button>'
      );
    }
    return '<button type="button" class="primary" data-sync="' + app.id + '">Sync to Apollo</button>';
  }

  function renderTable(){
    var content = document.getElementById('content');
    document.getElementById('countLabel').textContent = applications.length + (applications.length === 1 ? ' contact' : ' contacts');

    if(applications.length === 0){
      content.className = 'state';
      content.textContent = 'No sponsor applications yet.';
      return;
    }

    var rows = applications.map(function(app){
      return (
        '<tr>' +
          '<td>' + esc(app.name) + '</td>' +
          '<td>' + esc(app.email) + '</td>' +
          '<td>' + esc(app.company) + '</td>' +
          '<td>' + esc(app.budget) + '</td>' +
          '<td class="wrap-cell">' + esc(fmtList(app.audience)) + (app.audience_other ? ' (' + esc(app.audience_other) + ')' : '') + '</td>' +
          '<td class="wrap-cell">' + esc(fmtList(app.event_format)) + '</td>' +
          '<td>' + esc(fmtDate(app.created_at)) + '</td>' +
          '<td>' + renderApolloCell(app) + '</td>' +
          '<td>' + renderDropdown(app) + '</td>' +
        '</tr>'
      );
    }).join('');

    content.className = 'table-scroll';
    content.innerHTML =
      '<table>' +
        '<thead><tr>' +
          '<th>Name</th><th>Email</th><th>Company</th><th>Budget</th><th>Audience</th><th>Format</th><th>Submitted</th><th>Apollo</th><th>Emails sent</th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>';
  }

  document.addEventListener('click', function(e){
    var toggle = e.target.closest && e.target.closest('[data-toggle]');
    if(toggle){
      var dd = toggle.closest('.dropdown');
      var wasOpen = dd.classList.contains('open');
      document.querySelectorAll('.dropdown.open').forEach(function(el){ el.classList.remove('open'); });
      if(!wasOpen) dd.classList.add('open');
      return;
    }
    if(!e.target.closest('.dropdown')){
      document.querySelectorAll('.dropdown.open').forEach(function(el){ el.classList.remove('open'); });
    }

    var syncBtn = e.target.closest && e.target.closest('[data-sync]');
    if(syncBtn){
      syncToApollo(Number(syncBtn.getAttribute('data-sync')), syncBtn);
    }
  });

  document.addEventListener('change', function(e){
    if(e.target.matches('.dropdown-menu input[type="checkbox"]')){
      updateSentTemplates(Number(e.target.getAttribute('data-app')));
    }
  });

  async function updateSentTemplates(appId){
    var dd = document.querySelector('.dropdown[data-dropdown="' + appId + '"]');
    var ids = Array.prototype.map.call(
      dd.querySelectorAll('input[type="checkbox"]:checked'),
      function(cb){ return Number(cb.getAttribute('data-template')); }
    );
    try {
      await api('/api/applications/' + appId + '/sent-templates', { method: 'PUT', body: JSON.stringify({ templateIds: ids }) });
      var app = applications.find(function(a){ return a.id === appId; });
      if(app) app.sent_template_ids = ids;
      renderTable();
      document.querySelector('.dropdown[data-dropdown="' + appId + '"]').classList.add('open');
    } catch(err){
      alert('Could not save: ' + err.message);
    }
  }

  async function syncToApollo(appId, btn){
    btn.disabled = true;
    btn.textContent = 'Syncing…';
    try {
      var res = await api('/api/applications/' + appId + '/sync-apollo', { method: 'POST' });
      var data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Sync failed');
      var app = applications.find(function(a){ return a.id === appId; });
      if(app){ app.apollo_synced_at = data.apollo_synced_at; app.apollo_contact_id = data.apollo_contact_id; }
      renderTable();
    } catch(err){
      alert('Apollo sync failed: ' + err.message);
      btn.disabled = false;
      btn.textContent = 'Sync to Apollo';
    }
  }

  async function init(){
    try {
      var meRes = await api('/api/auth/me');
      var session = await meRes.json();
      renderUser(session);

      var [appsRes, templatesRes] = await Promise.all([
        api('/api/applications'),
        api('/api/templates'),
      ]);
      var appsData = await appsRes.json();
      var templatesData = await templatesRes.json();
      applications = appsData.applications || [];
      templates = templatesData.templates || [];
      renderTable();
    } catch(err){
      console.error(err);
    }
  }

  init();
</script>
</body>
</html>
